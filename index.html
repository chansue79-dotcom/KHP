<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전주문화방송(주) K-하이테크 플랫폼 공동훈련센터</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 디자인 토큰: 교육기관형 ───────────────── */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#FFFFFF; --fill:#F4F6F9; --fill-2:#EAEEF4;
  --ink:#1A2233; --muted:#5A6476; --faint:#8C95A6; --line:#DFE3EA; --line-2:#C9D0DB;
  --navy:#0F2A54; --navy-2:#173A70; --primary:#1F5FD1; --on-primary:#FFFFFF; --primary-soft:#EAF1FC;
  --brand:var(--primary); --on-brand:var(--on-primary); --soft:var(--fill);
  --c1:#1F5FD1; --c2:#0B98A8; --c3:#22935F; --c4:#B83C8E; --c5:#C98A00;
  --ok:#1E8752; --err:#D22B36;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1524;--surface:#141C2E;--fill:#1A2338;--fill-2:#222C44;--ink:#E9EDF5;--muted:#A6AFC0;--faint:#7D879B;--line:#27324A;--line-2:#34405B;
    --navy:#0A1C3A;--navy-2:#12294F;--primary:#6E9BFF;--on-primary:#0E1524;--primary-soft:#1B2A4A;--c1:#6E9BFF;--c2:#3CC3D1;--c3:#4CC38A;--c4:#E07CC0;--c5:#F0C24B;--ok:#4CC38A;--err:#FF6B76}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1524;--surface:#141C2E;--fill:#1A2338;--fill-2:#222C44;--ink:#E9EDF5;--muted:#A6AFC0;--faint:#7D879B;--line:#27324A;--line-2:#34405B;
  --navy:#0A1C3A;--navy-2:#12294F;--primary:#6E9BFF;--on-primary:#0E1524;--primary-soft:#1B2A4A;--c1:#6E9BFF;--c2:#3CC3D1;--c3:#4CC38A;--c4:#E07CC0;--c5:#F0C24B;--ok:#4CC38A;--err:#FF6B76}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}
.bleed{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}

/* ── 헤더 ───────────────────────────────── */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bars{display:none}
.util{background:var(--fill);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:36px}
.util .org{font-weight:500}
.acct{display:flex;gap:16px;align-items:center}
.tel{color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}
.acct #acct{display:flex;gap:14px;align-items:center}
.acct .btn{height:auto;padding:0;background:none;color:var(--ink);font-size:13px;font-weight:600}
.acct .btn:hover{background:none;color:var(--primary)}
.who{font-size:13px;font-weight:700;background:none;border:0;cursor:pointer;padding:0;color:var(--primary)}
.brandrow{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand .mark{width:40px;height:40px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:0 0 auto}
.brand .mark svg{width:24px;height:24px}
.brand .nm{display:flex;flex-direction:column;line-height:1.25}
.brand .nm small{font-size:12.5px;color:var(--muted);font-weight:600}
.brand .nm b{font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
:root:not([data-theme="light"]) .brand .nm b{color:var(--ink)}
.cats{display:flex;gap:0;height:76px;align-items:stretch}
.catw{position:relative;display:flex}
.cat{border:0;background:none;padding:0 18px;font-weight:700;font-size:16.5px;letter-spacing:-.02em;color:var(--ink);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.cat:hover,.catw:focus-within .cat{color:var(--primary)}
.cat[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary)}
.cat.hl{color:var(--primary)}
.sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);min-width:180px;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--primary);padding:8px 0;display:none;z-index:12;box-shadow:0 8px 24px rgba(15,42,84,.08)}
.catw:hover .sub,.catw:focus-within .sub{display:block}
.sub button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 18px;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sub button:hover{color:var(--primary);background:var(--fill)}
@media (max-width:980px){
  .brandrow{height:64px}.brand .nm small{display:none}.brand .nm b{font-size:17px}
  header .wrap.nav2{padding:0}
  .cats{height:auto;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding:0 12px}
  .cats::-webkit-scrollbar{display:none}
  .cat{padding:12px 12px;font-size:15px}
  .sub{display:none!important}
  .brandrow .cats{display:none}
  .navm{display:flex!important}
  .util .org{display:none}
}
.navm{display:none}

main{min-height:60vh;padding-bottom:72px}

/* ── 메인 배너 ───────────────────────────── */
.visual{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.visual::after{content:"";position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;border:80px solid rgba(255,255,255,.04)}
.visual .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:64px;padding-bottom:64px;position:relative;z-index:1}
@media (max-width:900px){.visual .wrap{grid-template-columns:1fr;gap:28px;padding-top:40px;padding-bottom:40px}}
.visual .kicker{display:inline-block;font-size:14px;font-weight:600;color:#BFD3FF;margin-bottom:14px}
.visual h1{font-size:clamp(32px,4.6vw,50px);line-height:1.2;letter-spacing:-.04em;font-weight:800;margin:0 0 18px;color:#fff}
.visual p{font-size:17px;color:#C9D4E8;margin:0 0 30px;max-width:32em}
.visual .ctas{display:flex;gap:10px;flex-wrap:wrap}
.visual .btn.solid{background:#fff;color:var(--navy)}
.visual .btn.solid:hover{background:#E8EEF9}
.visual .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.visual .btn.ghost:hover{background:rgba(255,255,255,.08)}
.notice-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:22px 24px}
.notice-box h2{font-size:15px;font-weight:700;color:#BFD3FF;margin:0 0 10px}
.notice-box ul{list-style:none;margin:0;padding:0}
.notice-box li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px}
.notice-box li:first-child{border-top:0}
.notice-box .tel-big{font-size:28px;font-weight:800;letter-spacing:-.03em;color:#fff;margin:0 0 12px;font-variant-numeric:tabular-nums}
.notice-box li b{color:#C9D4E8;font-weight:600;white-space:nowrap}
.notice-box li span{text-align:right}
.notice-box li button{background:none;border:0;color:#fff;cursor:pointer;text-align:left;padding:0;font-weight:600}
.notice-box li span{color:#fff;font-size:14.5px;font-variant-numeric:tabular-nums}

/* ── 퀵메뉴 ─────────────────────────────── */
.quick{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
@media (max-width:900px){.quick{grid-template-columns:repeat(3,1fr)}}
.qitem{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;padding:28px 8px;cursor:pointer;border-right:1px solid var(--line)}
.qitem:last-child{border-right:0}
@media (max-width:900px){.qitem:nth-child(3n){border-right:0}.qitem:nth-child(-n+3){border-bottom:1px solid var(--line)}}
.qitem .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);transition:background .15s,color .15s}
.qitem .ic svg{width:26px;height:26px}
.qitem:hover .ic{background:var(--primary);color:var(--on-primary)}
.qitem b{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.qitem span.d{font-size:13px;color:var(--muted);text-align:center;line-height:1.45}
@media (max-width:640px){.qitem span.d{display:none}.qitem{padding:20px 6px}.qitem .ic{width:52px;height:52px}}

/* ── 메인 게시판 ─────────────────────────── */
.boards{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding-top:56px}
@media (max-width:900px){.boards{grid-template-columns:1fr;gap:40px}}
.bh{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.bh h2{font-size:22px;font-weight:800;letter-spacing:-.035em;margin:0}
.more{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.more:hover{color:var(--primary)}
.more::after{content:"+";font-size:18px;line-height:1;font-weight:400}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.blist .dt{text-align:center;border-right:1px solid var(--line);padding-right:12px;line-height:1.2}
.blist .dt b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--navy)}
:root:not([data-theme="light"]) .blist .dt b{color:var(--ink)}
.blist .dt span{font-size:12.5px;color:var(--muted)}
.blist h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.blist .m{font-size:13.5px;color:var(--muted);margin-top:2px}
.blist .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.tag.low{background:color-mix(in srgb,var(--err) 10%,transparent);color:var(--err)}
.tag.off{background:var(--fill);color:var(--faint)}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.nlist li b{font-weight:600}
.nlist li span{color:var(--faint);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nlist .new{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--err)}
@media (max-width:560px){.blist li{grid-template-columns:52px 1fr}.blist .r{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between}}

/* ── 교육 분야 ───────────────────────────── */
.fields-h{padding-top:64px}
.fieldgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
@media (max-width:900px){.fieldgrid{grid-template-columns:1fr 1fr}}
.fcell{padding:24px 22px;background:var(--surface);border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;width:100%;height:100%;box-shadow:inset -1px 0 0 var(--line)}
.fcell:hover{background:var(--fill)}
.fcell .bar{display:block;width:28px;height:4px;border-radius:2px;background:var(--tone);margin-bottom:14px}
.fcell b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.fcell span{display:block;font-size:14px;color:var(--muted);line-height:1.55}

/* ── 하위 페이지 상단 ─────────────────────── */
.subvis{background:var(--fill);border-bottom:1px solid var(--line)}
.subvis .wrap{padding-top:40px;padding-bottom:0}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13px}
.crumb button:hover{color:var(--primary)}
.crumb i{font-style:normal;color:var(--faint)}
.subvis h1{font-size:32px;font-weight:800;letter-spacing:-.04em;margin:10px 0 24px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;border-bottom:0;background:none;padding:13px 22px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--primary);border-color:var(--line)}
.panel{background:var(--surface);padding:40px 0 0;margin-top:0}
h1.pt{font-size:24px;letter-spacing:-.035em;font-weight:800;margin:0 0 6px;line-height:1.3;padding-left:14px;border-left:4px solid var(--primary)}
p.pd{color:var(--muted);margin:0 0 28px;font-size:15.5px;max-width:46em}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:700;font-size:14.5px;cursor:pointer}
.none{padding:24px 0;color:var(--muted)}

/* ── 목록 ─────────────────────────────── */
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search input{flex:1 1 260px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.row:first-of-type{border-top:2px solid var(--ink)}
.row .tone{align-self:stretch;border-radius:2px;background:var(--tone,var(--faint))}
.row h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.025em}
.row .m{font-size:14px;color:var(--muted);margin-top:2px}
.row .r{text-align:right;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .r .btn{margin-top:6px}
.low{color:var(--err);font-weight:700}
@media (max-width:560px){.row{grid-template-columns:4px 1fr}.row .r{grid-column:2;text-align:left}}

/* ── 버튼 ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border:0;background:var(--fill);color:var(--ink);border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line-2);transition:background .15s}
.btn:hover{background:var(--fill-2)}
.btn.solid{background:var(--primary);color:var(--on-primary);box-shadow:none}
.btn.solid:hover{background:color-mix(in srgb,var(--primary) 86%,#000)}
.btn.big{height:52px;padding:0 28px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:560px){.btn.big{width:100%}}

/* ── 폼 ───────────────────────────────── */
form.f{display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;max-width:760px}
form.f .full{grid-column:1/-1}
@media (max-width:640px){form.f{grid-template-columns:1fr}}
.lb{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
.lb em{font-style:normal;color:var(--err);margin-left:3px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;font:400 16px/1.4 var(--font);padding:0 14px;height:50px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{min-height:120px;padding:12px 14px;resize:vertical;height:auto}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input:disabled{background:var(--fill);color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;border:1px solid var(--line-2);border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600;color:var(--muted);background:var(--surface)}
.opt input:checked+span{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.opt input:focus-visible+span{outline:2.5px solid var(--primary);outline-offset:2px}
.scale .opt span{min-width:52px;text-align:center}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.agree input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary)}
details.c{font-size:14px;color:var(--muted);background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
details.c summary{cursor:pointer;color:var(--ink);font-weight:700}
.msg{display:none;margin-top:18px;padding:14px 18px;border-radius:8px;font-weight:600;max-width:760px}
.msg.show{display:block}
.msg.err{background:color-mix(in srgb,var(--err) 9%,transparent);color:var(--err)}
.msg.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ok)}

/* ── 완료 화면 ───────────────────────────── */
.done{max-width:600px;margin:0 auto;text-align:center;padding:12px 0}
.done .mark{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 18px}
.done h2{margin:0 0 8px;font-size:26px;letter-spacing:-.04em;font-weight:800}
.done .pd{margin-left:auto;margin-right:auto}
.done dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:24px 0 28px;padding:20px 24px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.done dt{color:var(--muted)}
.done dd{margin:0;font-weight:600}
.done .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ── 로드맵 · 안내 ───────────────────────── */
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.road .col{padding:22px;box-shadow:inset -1px 0 0 var(--line)}
.road h3{margin:0 0 14px;font-size:17px;font-weight:800;letter-spacing:-.03em;padding-bottom:12px;border-bottom:3px solid var(--tone)}
.road ol{margin:0;padding:0;list-style:none}
.road li{padding:10px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.road li:last-child{border-bottom:0}
.road li small{display:inline-block;color:var(--tone);font-size:12.5px;font-weight:800;margin-right:8px}
.facts{display:grid;grid-template-columns:160px 1fr;gap:0;margin:0 0 28px;border-top:2px solid var(--ink)}
.facts dt,.facts dd{padding:16px 18px;border-bottom:1px solid var(--line);margin:0}
.facts dt{background:var(--fill);font-weight:700;font-size:14.5px}
@media (max-width:560px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0}}

/* ── 조회 결과 ───────────────────────────── */
.res{list-style:none;padding:0;margin:8px 0 0;max-width:820px;border-top:2px solid var(--ink)}
.res li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);font-weight:600}
.res small{display:block;color:var(--muted);font-size:13.5px;font-weight:500;margin-top:2px}

    state = {cat, tab:null, pick:{}, after: state.cat === "auth" ? state.after : (cat === "auth" ? (state.after || null) : null), reason, mode: (state.mode || "login")};
    if(reason === undefined && cat === "auth") state.reason = "";
    history.replaceState(null, "", "#" + cat); render(); window.scrollTo(0,0); return;
  }
  const c = MENU.find(m => m.id === cat);
  if(c && !c.tabs.find(t => t.id === tab)) tab = c.tabs[0].id;
  if(CONFIG.REQUIRE_LOGIN_TO_BROWSE && !AUTH && !c && cat === "home"){ state = {cat:"auth", after:"home", pick:{}, mode:"signup", reason:"홈페이지를 이용하려면 먼저 회원가입이나 로그인을 해주세요."}; history.replaceState(null, "", "#auth"); render(); return; }
  if(c && !AUTH && needsLogin(cat, tab)){
    const t = c.tabs.find(x => x.id === tab);
    state = {cat:"auth", after:`${cat}-${tab}`, afterPick: pick || {}, pick:{}, mode: state.mode || "login", reason:`‘${t.name}’은 회원만 이용할 수 있어요. 처음이라면 회원가입을, 가입했다면 로그인을 해주세요.`};
    history.replaceState(null, "", "#auth"); render(); window.scrollTo(0,0); return;
  }
  state = {cat: c ? cat : "home", tab: c ? tab : null, pick: pick || {}};
  const h = state.cat === "home" ? "" : `${state.cat}-${state.tab}`;
  if(location.hash.slice(1) !== h) history.replaceState(null, "", h ? "#"+h : location.pathname + location.search);
  render(); window.scrollTo(0,0);
}
document.addEventListener("click", e => {

function render(){

  if(state.cat === "auth"){ main.innerHTML = shell(state.mode === "signup" ? "회원가입" : "로그인", ["회원 서비스"], viewAuth()); return bindAuth(); }

  if(state.cat === "notice"){ main.innerHTML = shell("공지사항", ["안내"], viewNotice()); return; }
  const c = MENU.find(m => m.id === state.cat), t = c.tabs.find(x => x.id === state.tab);
  const tabs = `<div class="tabs" role="tablist">${c.tabs.map(x => `<button class="tab" role="tab" data-go="${c.id}-${x.id}" aria-selected="${x.id===t.id}">${esc(x.name)}</button>`).join("")}</div>`;
  const head = `<section class="subvis"><div class="wrap"><div class="crumb"><button data-go="home">홈</button><i>›</i><button data-go="${c.id}">${esc(c.name)}</button><i>›</i><span>${esc(t.name)}</span></div><h1>${esc(c.name)}</h1>${tabs}</div></section>`;
  const body = t.view === "library" ? viewLibrary()
    : t.view === "schedule" ? viewSchedule()
    : t.view === "roadmap" ? viewRoadmap()
    : t.view === "equip" ? viewEquip()
    : t.view === "info" ? viewInfo(t.info)
    : t.view === "lookup" ? viewLookup("check")
    : t.view === "cert" ? viewLookup("cert")
    : viewForm(t.form);
  main.innerHTML = head + `<div class="wrap"><section class="panel" role="tabpanel">${body}</section></div>`;
  if(t.view === "schedule") bindSchedule();
  if(t.view === "library") bindLibrary();
  if(t.view === "equip") bindEquip();
  if(t.view === "form") bindForm(t.form);
  if(t.view === "lookup" || t.view === "cert") bindLookup(t.view === "cert" ? "cert" : "check");
}

function readForm(form, key){
  const out = {};

    if(!form.querySelector(`[name="${f.k}"]`)) return;   // 화면에 없는 항목(회원 정보로 채움)은 건너뜀
    if(f.type === "file"){ const fl = form.querySelector(`[name="${f.k}"]`).files[0]; out[f.k] = fl ? fl.name : ""; out.__fileObj = fl || null; return; }
    if(f.type === "rrnConsent"){ out[f.k] = form.querySelector(`[name="${f.k}"]`).checked; return; }
    const holder = form.querySelector(`[name="${f.k}"]`)?.closest("[data-show]");
    if(holder && holder.hidden) return;
    if(f.type === "multi") out[f.k] = [...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(x => x.value);
    else if(f.type === "radio" || f.type === "scale") out[f.k] = form.querySelector(`[name="${f.k}"]:checked`)?.value || "";
    else if(f.type === "check") out[f.k] = form.querySelector(`[name="${f.k}"]`).checked;
    else out[f.k] = (form.querySelector(`[name="${f.k}"]`)?.value || "").trim();
  });
  out.agree = !!form.querySelector(`[name="__agree"]`)?.checked;
  return out;

function validate(d, key){

    if(v && f.k === "phone" && !/^01\d-?\d{3,4}-?\d{4}$/.test(v)) return "휴대폰 번호를 010-1234-5678 형식으로 입력하세요.";
    if(v && f.k === "birth" && !/^\d{6}$/.test(v)) return "생년월일을 숫자 6자리로 입력하세요. 예: 900101";
    if(v && f.type === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return "이메일 주소를 다시 확인하세요.";
    if(v && f.type === "url" && !/^https?:\/\//.test(v)) return "작품 링크는 https:// 로 시작하는 주소로 입력하세요.";
    if(f.type === "rrn" && !/^[1-8]\d{6}$/.test(v)) return "주민등록번호 뒤 7자리를 정확히 입력하세요.";
    if(f.type === "rrnConsent" && !v) return "고유식별정보(주민등록번호) 수집·이용에 동의해야 신청할 수 있어요.";

    if(f.type === "file" && d.__fileObj){ const ext = d.__fileObj.name.split(".").pop().toLowerCase(); if(!["pdf","hwp","hwpx","doc","docx","jpg","jpeg","png"].includes(ext)) return "PDF, HWP, 워드 문서, JPG·PNG 파일만 올릴 수 있어요."; if(d.__fileObj.size > 10*1024*1024) return "파일은 10MB 이하만 올릴 수 있어요."; }

}
function bindForm(key){
  const form = $("#form"), msg = $("#fmsg");

    const [k, v] = el.dataset.show.split(":"); el.hidden = (form.querySelector(`[name="${k}"]:checked`)?.value || "") !== v; });
  form.addEventListener("change", sync); sync();
  form.querySelector('[name="__file"]')?.addEventListener("change", e => { const fl = e.target.files[0]; $("#fileLabel").textContent = fl ? `${fl.name} (${Math.ceil(fl.size/1024)}KB)` : "파일을 선택하세요"; });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const d = readForm(form, key), err = validate(d, key);

    const btn = form.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "제출하는 중";

      if(AUTH && key === "agree"){ AUTH.me.agreementOk = true; AUTH.me.agreement = { status: "제출", company: d.company }; if(!AUTH.me.company) AUTH.me.company = d.company; setAuth(AUTH); }

    }
  });
}

    <div class="authtabs" role="tablist"><button role="tab" data-mode="login" aria-selected="${m==="login"}">로그인</button><button role="tab" data-mode="signup" aria-selected="${m==="signup"}">회원가입</button></div>
    ${m === "login" ? `<h1 class="pt">로그인</h1><p class="pd">가입할 때 입력한 정보로 로그인해요.</p>
      <form class="f" id="authForm" novalidate style="grid-template-columns:1fr">
        <div><label class="lb" for="aName">이름</label><input id="aName" type="text" autocomplete="name"></div>
        <div><label class="lb" for="aBirth">주민등록번호 앞 6자리</label><input id="aBirth" type="text" inputmode="numeric" maxlength="6" placeholder="900101" autocomplete="off"></div>
        <div><label class="lb" for="aPhone">휴대폰</label><input id="aPhone" type="tel" autocomplete="tel" placeholder="010-1234-5678"></div>
        <div><button class="btn solid big" type="submit" style="width:100%">로그인</button></div></form>`
    : `<h1 class="pt">회원가입</h1><p class="pd">한 번 가입하면 교육 신청, 신청 확인, 수료증 발급을 바로 할 수 있어요. 교육을 신청할 때는 기업 협약서 제출과 주민등록번호 뒷자리 입력이 추가로 필요해요.</p>
      <form class="f" id="authForm" novalidate>
        <div><label class="lb" for="aName">이름<em>*</em></label><input id="aName" type="text" autocomplete="name"></div>
        <div><label class="lb" for="aBirth">주민등록번호 앞 6자리<em>*</em></label><input id="aBirth" type="text" inputmode="numeric" maxlength="6" placeholder="900101" autocomplete="off"><div class="hint">뒷자리는 받지 않아요.</div></div>
        <div><label class="lb" for="aPhone">휴대폰<em>*</em></label><input id="aPhone" type="tel" autocomplete="tel" placeholder="010-1234-5678"></div>
        <div><label class="lb" for="aCompany">소속 기업명</label><input id="aCompany" type="text" autocomplete="organization" placeholder="재직 중인 회사·기관"></div>
        <div class="full"><label class="lb" for="aEmail">이메일 (선택)</label><input id="aEmail" type="email" autocomplete="email"><div class="hint">수료증을 메일로 받을 주소예요.</div></div>
        <div class="full"><details class="c" open><summary>개인정보 수집·이용 안내</summary><p>수집 항목: 이름, 주민등록번호 앞 6자리(생년월일), 휴대폰, 소속 기업명, 이메일(선택)<br>이용 목적: 회원 확인, 교육 신청·운영, 수료 관리와 수료증 발급, 사업 성과 보고<br>보유 기간: ${esc(CONFIG.RETENTION)} (탈퇴 요청 시 지체 없이 파기)<br>동의하지 않을 수 있으나, 동의하지 않으면 회원 서비스를 이용할 수 없어요.</p></details></div>
        <label class="agree full"><input type="checkbox" id="aAgree"> 개인정보 수집·이용에 동의합니다. (필수)</label>
        <label class="agree full"><input type="checkbox" id="aMkt"> 교육 모집 소식을 문자로 받겠습니다. (선택)</label>
        <div class="full"><button class="btn solid big" type="submit">가입하기</button></div></form>`}
    <div class="msg" id="aMsg" role="alert"></div></div>`;
}
function bindAuth(){
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
  $("#authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#aMsg"), err = t => { msg.className = "msg show err"; msg.textContent = t; };
    const name = $("#aName").value.trim(), birth = $("#aBirth").value.replace(/\D/g,""), phone = $("#aPhone").value.trim();
    if(!name) return err("이름을 입력하세요.");
    if(birth.length !== 6) return err("주민등록번호 앞 6자리를 숫자로 입력하세요.");
    if(!/^01\d-?\d{3,4}-?\d{4}$/.test(phone)) return err("휴대폰 번호를 010-1234-5678 형식으로 입력하세요.");
    const signup = state.mode === "signup";
    const data = signup ? { name, birth, phone, company: $("#aCompany").value.trim(), email: $("#aEmail").value.trim(), agree: $("#aAgree").checked, marketing: $("#aMkt").checked } : null;
    if(signup && data.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) return err("이메일 주소를 다시 확인하세요.");
    if(signup && !data.agree) return err("개인정보 수집·이용에 동의해야 가입할 수 있어요.");
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    try{
      const r = DEMO ? { ok:true, token:"demo", me:{ name, birth, phone, company: data ? data.company : "(주)예시미디어", email: data ? data.email : "ho***@example.com", kind:"재직자", hasRrn:false, agreementOk:false, agreement:null } }
        : signup ? await api("signup", { data }) : await api("login", { name, birth, phone });
      if(!r.ok) return err(r.message || "처리하지 못했어요.");
      setAuth({ token: r.token, me: r.me });
      const after = state.after, pick = state.afterPick;
      go(after || "home", pick);
    }catch(ex){ err("처리하지 못했어요. 잠시 후 다시 시도하세요."); }
    finally{ btn.disabled = false; }
  });
}
function viewMe(){
  const m = AUTH.me;
  return `<div class="auth"><h1 class="pt">내 정보</h1><p class="pd">이름과 생년월일은 바꿀 수 없어요. 잘못 입력했다면 ${esc(CONFIG.TEL)}로 연락해 주세요.</p>
    <form class="f" id="meForm" novalidate>
      <div><label class="lb">이름</label><input type="text" value="${esc(m.name)}" disabled></div>
      <div><label class="lb">생년월일</label><input type="text" value="${esc(m.birth)}" disabled></div>
      <div><label class="lb" for="mPhone">휴대폰</label><input id="mPhone" type="tel" value="${esc(m.phone)}"></div>
      <div><label class="lb" for="mCompany">소속 기업명</label><input id="mCompany" type="text" value="${esc(m.company)}"></div>
      <div class="full"><label class="lb" for="mEmail">이메일</label><input id="mEmail" type="email" value="${esc(m.email)}"></div>
      <div class="full me-line" style="margin:0">기업 협약서: <b>${m.agreement ? `${esc(m.agreement.company)} · ${esc(m.agreement.status)}` : "제출 전"}</b> <button class="link" type="button" data-go="lib-agree">협약서 제출</button><br>주민등록번호: <b>${m.hasRrn ? "등록됨 (암호화 저장)" : "교육 신청 시 입력"}</b></div>
      <label class="agree full"><input type="checkbox" id="mMkt" ${m.marketing?"checked":""}> 교육 모집 소식을 문자로 받겠습니다.</label>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn solid" type="submit">저장</button><button class="btn" type="button" id="meOut">로그아웃</button></div></form>
    <div class="msg" id="mMsg" role="status"></div></div>`;
}
function bindMe(){
  $("#meOut").addEventListener("click", () => { setAuth(null); go("home"); });
  $("#meForm").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#mMsg"), data = { phone: $("#mPhone").value.trim(), company: $("#mCompany").value.trim(), email: $("#mEmail").value.trim(), marketing: $("#mMkt").checked };
    if(!/^01\d-?\d{3,4}-?\d{4}$/.test(data.phone)){ msg.className = "msg show err"; msg.textContent = "휴대폰 번호를 확인하세요."; return; }
    try{
      const r = DEMO ? { ok:true, me: Object.assign({}, AUTH.me, data) } : await api("updateMe", { data });
      if(!r.ok) throw new Error(r.message);
      setAuth({ token: AUTH.token, me: r.me }); msg.className = "msg show ok"; msg.textContent = "저장했어요.";
    }catch(ex){ msg.className = "msg show err"; msg.textContent = ex.message || "저장하지 못했어요."; }
  });
}

/* 수료증 보기·인쇄·PDF·메일 */
let CERTS = {}, CUR_CERT = null;
function openCert(c){
  CUR_CERT = c;
  const m = document.createElement("div"); m.className = "cm"; m.id = "certModal";
  m.innerHTML = `<div class="cm-box" role="dialog" aria-modal="true" aria-label="수료증">
    <div class="cm-bar"><b>${esc(c.no)} 수료증</b><span class="sp"></span>
      <button class="btn solid" id="cPrint">인쇄</button><button class="btn" id="cPdf">PDF 저장</button>
      ${c.emailMasked?`<button class="btn" id="cMail">메일로 받기</button>`:""}<button class="btn" id="cClose" aria-label="닫기">닫기</button></div>
    <p class="hint cm-hint">인쇄 창에서 ‘대상’을 <b>PDF로 저장</b>으로 바꾸면 파일로도 받을 수 있어요.${c.emailMasked?` 메일은 신청 때 등록한 주소(${esc(c.emailMasked)})로만 보내드려요.`:""}</p>
    <div class="cm-view" id="cView"><iframe id="cFrame" title="수료증 미리보기"></iframe></div>
    <div class="msg" id="cMsg" role="status"></div></div>`;
  document.body.appendChild(m); document.body.style.overflow = "hidden";
  const f = $("#cFrame"); f.srcdoc = c.html;
  const fit = () => { const w = $("#cView").clientWidth, s = Math.min(1, (w - 8) / 800); f.style.transform = `scale(${s})`; $("#cView").style.height = `${1130 * s + 8}px`; };
  f.addEventListener("load", fit); window.addEventListener("resize", fit); fit();
  const close = () => { m.remove(); document.body.style.overflow = ""; window.removeEventListener("resize", fit); };
  $("#cClose").addEventListener("click", close);
  m.addEventListener("click", e => { if(e.target === m) close(); });
  document.addEventListener("keydown", function k(e){ if(e.key === "Escape"){ close(); document.removeEventListener("keydown", k); } });
  $("#cPrint").addEventListener("click", () => { try{ f.contentWindow.focus(); f.contentWindow.print(); } catch(ex){ certMsg("err","이 화면에서는 인쇄를 열 수 없어요. PDF 저장을 이용하세요."); } });
  $("#cPdf").addEventListener("click", savePdf);
  $("#cMail")?.addEventListener("click", sendMail);
}
function certMsg(type, text){ const el = $("#cMsg"); el.className = `msg show ${type}`; el.textContent = text; }
function loadScript(src){ return new Promise((res, rej) => { if(document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function savePdf(){
  const btn = $("#cPdf"); btn.disabled = true; btn.textContent = "만드는 중";
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const doc = $("#cFrame").contentDocument, page = doc.querySelector(".page");
    const canvas = await window.html2canvas(page, {scale: 2, backgroundColor: "#ffffff", useCORS: true});
    const pdf = new window.jspdf.jsPDF({orientation: "portrait", unit: "mm", format: "a4"});
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297);
    pdf.save(`수료증_${AUTH ? AUTH.me.name : ""}_${CUR_CERT.no}.pdf`);
    certMsg("ok","PDF 파일을 저장했어요. 다운로드 폴더를 확인하세요.");
  }catch(ex){ certMsg("err","PDF를 만들지 못했어요. 인쇄 버튼을 누른 뒤 ‘PDF로 저장’을 선택해 주세요."); }
  finally{ btn.disabled = false; btn.textContent = "PDF 저장"; }
}
async function sendMail(){
  const btn = $("#cMail"); btn.disabled = true; btn.textContent = "보내는 중";
  try{
    const r = DEMO ? (await new Promise(x => setTimeout(x, 500)), {ok:true, to:CUR_CERT.emailMasked}) : await api("certMail", {certId:CUR_CERT.id});
    if(r.ok) certMsg("ok", `${r.to}로 수료증 PDF를 보냈어요.${DEMO?" (미리보기라 실제로 발송되지는 않아요)":""}`);
    else certMsg("err", r.message || "메일을 보내지 못했어요.");
  }catch(ex){ certMsg("err","메일을 보내지 못했어요. 잠시 후 다시 시도하세요."); }
  finally{ btn.disabled = false; btn.textContent = "메일로 받기"; }
}

    const ITEMS = FORMS.rent.fields.find(f => f.k === "items").opts;

      item: ITEMS.includes(e.cat) ? e.cat : ITEMS.includes(e.name) ? e.name : "기타" })); }
  catch(e){ DEMO = true; sessions = DEMO_SESSIONS; pastSessions = DEMO_PAST; }
  $("#demo").classList.toggle("show", DEMO);
